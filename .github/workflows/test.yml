name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, ubuntu-24.04, ubuntu-24.04-arm]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          controlplane-url: ${{ vars.CONTROLPLANE_URL }}
          audience: riptides
      - name: Verify kernel module loaded
        run: lsmod | grep riptides
      - name: Verify daemon is running
        run: systemctl is-active riptides
